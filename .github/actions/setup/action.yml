name: Setup
description: Install the project toolchain and locked Yarn dependencies

inputs:
  tools:
    description: mise tools required by the job
    default: node yarn clang-format

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install_args: ${{ inputs.tools }}
        cache: true

    - id: yarn-cache
      shell: bash
      run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: ${{ steps.yarn-cache.outputs.path }}
        key: yarn-${{ runner.os }}-${{ hashFiles('mise.toml', 'yarn.lock') }}

    - shell: bash
      run: yarn install --immutable
