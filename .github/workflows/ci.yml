name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: yarn lint
      - run: yarn build
      - name: Check release plan
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: yarn changeset status --since="$BASE_SHA"

  build-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          tools: node yarn ruby
      - name: Install locked iOS dependencies
        working-directory: example/ios
        env:
          BUNDLE_FROZEN: 'true'
        run: |
          bundle install
          bundle exec pod install --deployment
      - run: yarn example build:ios
